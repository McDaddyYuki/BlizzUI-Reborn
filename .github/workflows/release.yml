# Publishes a release when the maintainer pushes a version tag (vX.Y.Z).
# The "publish" job uses the protected "release" environment, so nothing
# is published until the maintainer approves the run on GitHub.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The tag must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag $GITHUB_REF_NAME is not on main."; exit 1; }
      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1
      - name: Lua 5.1 compile and lint
        run: |
          for f in BlizzUIReborn/*.lua; do luac5.1 -p "$f" || exit 1; done
          python3 tools/lint51.py BlizzUIReborn
      - name: Regression tests
        run: LUA=lua5.1 tools/run_all.sh
      - name: Build the ZIP (tag, .toc and Core.lua versions must agree)
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/package.py "$version"
          python3 scripts/check_package.py "dist/BlizzUIReborn-$version.zip" "$version"
          python3 scripts/release_notes.py "$version" > dist/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          retention-days: 30

  publish:
    name: Publish (maintainer approval)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/BlizzUIReborn-$version.zip" \
            --verify-tag --title "BlizzUI Reborn $version" --notes-file dist/notes.md
